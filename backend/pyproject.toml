[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-ai"
version = "0.1.0"
description = "Multi-language security scanner and AI remediation engine"
readme = "../README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pydantic>=2.0.0"
]
scanners = [
    "bandit>=1.7.0",
    "semgrep>=1.0.0"
]

[project.scripts]
codeguard = "codeguard.cli:main"
